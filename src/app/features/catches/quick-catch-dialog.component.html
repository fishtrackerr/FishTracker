<h2 mat-dialog-title>Quick Add Catch</h2>
<mat-dialog-content class="quick-catch-content">
  <mat-form-field appearance="outline" class="full">
    <mat-label>Species</mat-label>
    <mat-select [(ngModel)]="species" [panelClass]="selectPanelClass">
      @for (s of speciesList; track s) {
        <mat-option [value]="s">{{ s }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Weight (kg)</mat-label>
    <input matInput type="number" step="0.1" [(ngModel)]="weightKg" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Length (cm)</mat-label>
    <input matInput type="number" [(ngModel)]="lengthCm" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Bait</mat-label>
    <input matInput [(ngModel)]="bait" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Rig</mat-label>
    <input matInput [(ngModel)]="rig" />
  </mat-form-field>

  <div class="photo-row">
    <button mat-stroked-button type="button" (click)="pickPhoto()">
      {{ photo ? 'Photo selected' : 'Add Photo' }}
    </button>
  </div>

  <app-expandable-section
    sectionId="quick-catch-more"
    label="more details"
    persistKey="quick-catch-more"
    [defaultExpanded]="false"
  >
    <div expandHeader class="more-label">More details</div>
    <mat-checkbox [(ngModel)]="released">Released</mat-checkbox>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Notes</mat-label>
      <textarea matInput rows="2" [(ngModel)]="notes"></textarea>
    </mat-form-field>
  </app-expandable-section>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button mat-dialog-close type="button">Cancel</button>
  <button
    mat-flat-button
    class="save-btn"
    type="button"
    [disabled]="!species.trim() || saving()"
    (click)="save()"
  >
    {{ saving() ? 'Saving...' : 'Save' }}
  </button>
</mat-dialog-actions>
