<app-page-title title="lakes.title" />
<button mat-flat-button class="add-btn" (click)="addLake()">{{ 'lakes.addLake' | tr }}</button>

@if (sortedLakes.length === 0) {
  <app-empty-state
    title="lakes.emptyTitle"
    message="lakes.emptyMessage"
  />
} @else {
  @for (lake of sortedLakes; track lake.id) {
    <a [routerLink]="['/lakes', lake.id]" class="lake-card">
      <div class="cover">
        <app-image-thumb
          [imageId]="lake.coverImageId ?? lake.photoIds[0]"
          [alt]="lake.name"
          placeholder="🏞"
        />
      </div>
      <div class="info">
        <span class="name">{{ lake.name }}</span>
        <span class="spots">{{ lake.spots.length }} {{ 'lakes.spots' | tr }}</span>
      </div>
      <button mat-icon-button (click)="toggleFavorite($event, lake.id)" [attr.aria-label]="'lakes.toggleFavorite' | tr">
        <mat-icon>{{ lake.isFavorite ? 'star' : 'star_border' }}</mat-icon>
      </button>
    </a>
  }
}
