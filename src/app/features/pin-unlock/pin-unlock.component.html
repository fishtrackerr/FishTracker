<div class="pin-screen">
  <h1>Unlock</h1>
  <p>Enter your 6-digit PIN</p>
  <div class="dots">
    @for (i of [0,1,2,3,4,5]; track i) {
      <span class="dot" [class.filled]="pin().length > i"></span>
    }
  </div>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <div class="numpad">
    @for (d of ['1','2','3','4','5','6','7','8','9','','0','⌫']; track $index) {
      @if (d) {
        <button type="button" class="key" (click)="d === '⌫' ? removeDigit() : addDigit(d)">{{ d }}</button>
      } @else {
        <span></span>
      }
    }
  </div>
</div>
