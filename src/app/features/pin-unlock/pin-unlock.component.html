<div class="pin-screen">
  <button
    type="button"
    mat-icon-button
    class="update-refresh"
    [disabled]="checkingForUpdates()"
    [attr.aria-label]="checkingForUpdates() ? ('pin.checkingForUpdates' | tr) : ('pin.checkForUpdates' | tr)"
    [attr.title]="checkingForUpdates() ? ('pin.checkingForUpdates' | tr) : ('pin.checkForUpdates' | tr)"
    (click)="checkForUpdates()"
  >
    <mat-icon aria-hidden="true">refresh</mat-icon>
  </button>
  <h1>{{ 'pin.unlock' | tr }}</h1>
  <p>{{ 'pin.enterPin' | tr }}</p>
  <p class="version">{{ 'pin.appVersion' | tr }} v{{ version() }}</p>
  <div class="dots">
    @for (i of [0,1,2,3,4,5]; track i) {
      <span class="dot" [class.filled]="pin().length > i"></span>
    }
  </div>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <div class="numpad">
    @for (d of ['1','2','3','4','5','6','7','8','9','','0','⌫']; track $index) {
      @if (d) {
        <button type="button" class="key" (click)="d === '⌫' ? removeDigit() : addDigit(d)">{{ d }}</button>
      } @else {
        <span></span>
      }
    }
  </div>
</div>
