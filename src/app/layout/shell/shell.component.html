<div class="shell">
  <main #content class="content" tabindex="-1">
    <router-outlet />
  </main>
  <nav class="bottom-nav" [class.with-current]="!!activeSession()">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <mat-icon>home</mat-icon>
      <span>{{ 'nav.home' | tr }}</span>
    </a>
    @if (activeSession()) {
      <a routerLink="/sessions/active" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>play_circle</mat-icon>
        <span>{{ 'nav.current' | tr }}</span>
      </a>
    }
    <a routerLink="/sessions" routerLinkActive="active">
      <mat-icon>event</mat-icon>
      <span>{{ 'nav.sessions' | tr }}</span>
    </a>
    <a routerLink="/lakes" routerLinkActive="active">
      <mat-icon>water</mat-icon>
      <span>{{ 'nav.lakes' | tr }}</span>
    </a>
    <a routerLink="/gallery" routerLinkActive="active">
      <mat-icon>photo_library</mat-icon>
      <span>{{ 'nav.gallery' | tr }}</span>
    </a>
    <a routerLink="/statistics" routerLinkActive="active">
      <mat-icon>bar_chart</mat-icon>
      <span>{{ 'nav.stats' | tr }}</span>
    </a>
    <a routerLink="/settings" routerLinkActive="active">
      <mat-icon>settings</mat-icon>
      <span>{{ 'nav.settings' | tr }}</span>
    </a>
  </nav>
</div>
